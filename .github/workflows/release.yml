name: Release
on:
  push:
    branches: [main]
  # Retries a release that stopped partway; the run finishes the latest tag.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    name: Release
    # A manual run from another branch would only be skipped as stale below.
    if: github.ref == 'refs/heads/main'
    # The plugin is a macOS executable, so the release build runs where it runs.
    runs-on: macos-26
    timeout-minutes: 60
    # Every write (tag, release, Homebrew tap) uses the Robborg app token.
    permissions:
      contents: read
    steps:
      # Release tags must be pushed as Robborg to trigger the machine image
      # workflow. The same token publishes the formula to the Homebrew tap.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ROBBORG_CLIENT_ID }}
          private-key: ${{ secrets.ROBBORG_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            container-compose-plugin
            homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; inherited from the source repository
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install: false
          cache: false
      # Only Cocogitto: the linters in mise.toml are not needed to release.
      - name: Install release tooling
        run: mise install --locked cocogitto
      - name: Check toolchain
        run: swift --version
      # Cocogitto picks the version from the commits since the latest tag, then
      # the script stamps and packages the executable, pushes the tag, and
      # publishes the release and Homebrew formula (see scripts/release.sh).
      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Run only the locked Cocogitto installed above; never fetch the
          # linters or anything else in mise.toml mid-release.
          MISE_EXEC_AUTO_INSTALL: "false"
        run: |
          # Do not release a stale commit if main advanced while this queued.
          git fetch -q origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "main has advanced; the newer run will release it"
            exit 0
          fi
          ./scripts/release.sh
